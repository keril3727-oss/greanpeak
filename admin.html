<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КИНО — Админ-панель</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="logo" href="/">K<span>▶</span>НО</a><nav><a href="/">Открыть кинотеатр ↗</a></nav></header><main class="section"><small>УПРАВЛЕНИЕ КАТАЛОГОМ</small><h1>Админ-панель</h1><p style="color:#aaa">Добавление и редактирование карточек каталога. Эта версия сохраняет записи в браузере; серверное хранилище видео и защищённый вход подключаются отдельно.</p><div class="modal-card" style="max-width:760px"><form id="form"><input type="hidden" id="id"><p><input id="title" placeholder="Название" required style="width:100%"></p><p><input id="year" type="number" placeholder="Год" required></p><p><select id="genre"><option>Драма</option><option>Боевик</option><option>Комедия</option><option>Фантастика</option><option>Триллер</option><option>Документальный</option></select> <select id="type"><option>Фильм</option><option>Сериал</option></select></p><p><textarea id="desc" placeholder="Описание" style="width:100%;min-height:90px;background:#171922;color:white;border:1px solid #303340;padding:12px"></textarea></p><p>Постер: <input id="poster" type="file" accept="image/*"></p><p>Видео: <input id="video" type="file" accept="video/*"></p><button class="primary" type="submit">Сохранить карточку</button></form></div><h2>Материалы</h2><div id="list" class="grid"></div></main><script>const $=id=>document.getElementById(id);let items=JSON.parse(localStorage.getItem('kino_items')||'[]');function draw(){ $('list').innerHTML=items.map(x=>'<article class="movie"><div class="poster"><img src="'+x.poster+'"></div><h3>'+x.title+'</h3><p>'+x.year+' · '+x.type+'</p><button onclick="edit(\''+x.id+'\')">Изменить</button> <button onclick="removeItem(\''+x.id+'\')">Удалить</button></article>').join('')||'<p>Каталог пока пуст.</p>'}window.edit=id=>{let x=items.find(a=>a.id===id);if(!x)return;$('id').value=x.id;$('title').value=x.title;$('year').value=x.year;$('genre').value=x.genre;$('type').value=x.type;$('desc').value=x.desc};window.removeItem=id=>{items=items.filter(x=>x.id!==id);save()};function save(){localStorage.setItem('kino_items',JSON.stringify(items));draw()}$('form').onsubmit=async e=>{e.preventDefault();let id=$('id').value||crypto.randomUUID();let old=items.find(x=>x.id===id)||{};const read=f=>new Promise(resolve=>{let file=$(f).files[0];if(!file)return resolve(null);let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)});let poster=await read('poster'),video=await read('video');let item={id,title:$('title').value,year:Number($('year').value),genre:$('genre').value,type:$('type').value,desc:$('desc').value,poster:poster||old.poster||'',video:video||old.video||''};items=items.filter(x=>x.id!==id);items.unshift(item);save();$('form').reset();$('id').value=''};draw();</script></body></html>
